spring:
  application:
    name: darksouls-challenge
  datasource:
    url: jdbc:postgresql://localhost:5432/darksouls_challenge
    username: postgres
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema.
      ddl-auto: none
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

generation:
  # Off in tests, which run the worker's steps themselves.
  background: true

rate-limits:
  auth-per-minute: 20
  generation-per-minute: 30
  preview-per-minute: 60
  # The header a trusted proxy puts the player's address in. Empty when clients reach the server directly: then anyone could forge it.
  client-header: ""

# On a port of their own, which the public never reaches.
management:
  server:
    port: 8081
  endpoints:
    web:
      exposure:
        include: health,info,prometheus

# app.jwt.secret has no default on purpose: without it (JWT_SECRET, at least 32 bytes) the server refuses to start, rather than sign
# tokens with a key anyone could read here.
app:
  jwt:
    secret: ${JWT_SECRET:}
