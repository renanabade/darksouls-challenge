name: Deploy

# By hand only, from the Actions tab: a deploy costs money and changes what players see.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: deploy/package-lock.json
      - run: npm ci
      - name: Deploy the Worker and the container
        run: npx wrangler deploy
      - name: Hand the server its secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DATABASE_USERNAME: ${{ secrets.DATABASE_USERNAME }}
          DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
        run: |
          for name in JWT_SECRET DATABASE_URL DATABASE_USERNAME DATABASE_PASSWORD; do
            printenv "$name" | npx wrangler secret put "$name"
          done
