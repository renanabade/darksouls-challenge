name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TEST_BROWSER: '1'
    steps:
      # Actions pinned by commit SHA (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: ./mvnw -B spotless:check
      - run: npm ci
        working-directory: web
      - run: npx ng build
        working-directory: web
      - run: ./mvnw -B verify

  image:
    name: Build the image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build --tag darksouls-challenge .

      # The image on the resources the deploy gives it: if it does not start here, it will not start there.
      - name: Run the image and ask it for a challenge
        run: |
          docker network create check
          docker run -d --network check --name db -e POSTGRES_PASSWORD=postgres postgres:17
          until docker exec db pg_isready -U postgres; do sleep 1; done
          docker run -d --network check --name server --cpus=1 --memory=1g -p 8080:8080 \
            -e JWT_SECRET=a-secret-for-this-check-and-nothing-else \
            -e SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/postgres \
            -e SPRING_DATASOURCE_USERNAME=postgres \
            -e SPRING_DATASOURCE_PASSWORD=postgres \
            darksouls-challenge
          for i in $(seq 1 120); do
            curl -fs localhost:8080/api/health && break
            sleep 1
          done
          curl -fs localhost:8080/api/health
          docker logs server 2>&1 | grep -o 'Started DarkSoulsApplication in [^"]*' || true
          curl -fs localhost:8080/ | grep -q app-root
          curl -fs -w '\npreview: %{time_total}s\n' -o /dev/null 'localhost:8080/api/previews?seed=check&length=epic&difficulty=hard'
          curl -fs 'localhost:8080/api/previews?seed=check&length=short' | grep -q '"view"'
          docker stats --no-stream --format 'memory: {{.MemUsage}}' server
      - name: Show the server's logs
        if: failure()
        run: docker logs server 2>&1 | tail -60
