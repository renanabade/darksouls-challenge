name: CI

on:
  pull_request:
  push:
    branches: [main]
  # Run by the release workflow on its release PR branch (see release-please.yml).
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # A throwaway database for the database tests (packages/db), which migrate it themselves.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: darksouls
          POSTGRES_PASSWORD: darksouls
          POSTGRES_DB: darksouls
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U darksouls" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://darksouls:darksouls@localhost:5432/darksouls
    steps:
      # Actions pinned by commit SHA (tags can be moved); Dependabot keeps them current.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  commitlint:
    name: Commit messages
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }}
