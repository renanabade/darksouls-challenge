name: Deploy web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-web
  cancel-in-progress: true

jobs:
  deploy:
    name: Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Set in the repository's secrets. Without them the site is built, and the deploy is skipped.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The web app and the packages it depends on.
      - run: pnpm --filter "@darksouls-challenge/web..." build
      # dlx, not wrangler-action: the action runs `pnpm add wrangler`, which pnpm refuses at a workspace root.
      - if: env.CLOUDFLARE_API_TOKEN != ''
        run: pnpm dlx wrangler@4.149.0 pages deploy apps/web/out --project-name=darksouls-challenge --branch=main
      - if: env.CLOUDFLARE_API_TOKEN == ''
        run: echo "::notice::No Cloudflare secrets set; the site was built but not deployed."
