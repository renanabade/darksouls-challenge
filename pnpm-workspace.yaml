packages:
  - packages/*
  - apps/*

allowBuilds:
  # @swc/core only checks its prebuilt binary on install; the optional platform package already has it.
  "@swc/core": false
  # Only prints a notice on install.
  "@apollo/protobufjs": false
  protobufjs: false
  # Testcontainers: optional native speedups for Docker over SSH, which the tests do not use.
  ssh2: false
  cpu-features: false
  # Prisma downloads its schema engine (used by migrations) on install.
  "@prisma/engines": true
  prisma: true
