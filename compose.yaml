# Local services for development: `docker compose up -d`, then
#   DATABASE_URL=postgresql://darksouls:darksouls@localhost:5432/darksouls
#   REDIS_URL=redis://localhost:6379
#   RABBITMQ_URL=amqp://guest:guest@localhost:5672
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: darksouls
      POSTGRES_PASSWORD: darksouls
      POSTGRES_DB: darksouls
    ports:
      - "5432:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U darksouls"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    ports:
      - "5672:5672"
      - "15672:15672" # management UI, guest/guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  postgres:
